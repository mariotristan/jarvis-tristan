name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The portable core and the `tristan` command on a real Windows machine. The Mac app (AppKit) is not built here:
  # Package.swift only declares it on macOS.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Plan Task 19: scripts/setup-ollama.ps1 on a machine without Ollama (only the Windows folders on PATH and an
      # empty LOCALAPPDATA), in pwsh and in Windows PowerShell 5.1. Nothing is installed, started or downloaded.
      - name: setup-ollama.ps1 (parses, -StartOnly without Ollama, bad arguments)
        run: |
          $ErrorActionPreference = 'Continue'   # the script's refusals go to stderr; exit codes are checked below
          $failures = 0
          function Check($label, $ok) {
            if ($ok) { Write-Host "PASS: $label" } else { Write-Host "FAIL: $label"; $script:failures++ }
          }
          $target = (Resolve-Path scripts\setup-ollama.ps1).Path
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($target, [ref]$tokens, [ref]$errors) | Out-Null
          $errors | ForEach-Object { Write-Host "parse error: $_" }
          Check "the PowerShell parser finds no errors ($(@($errors).Count))" (@($errors).Count -eq 0)
          $shells = @((Get-Command pwsh).Source, (Get-Command powershell).Source)
          $empty = Join-Path $env:RUNNER_TEMP "no-ollama-$(Get-Random)"
          New-Item -ItemType Directory $empty | Out-Null
          $savedPath = $env:Path; $savedLocal = $env:LOCALAPPDATA
          try {
            $env:Path = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
            $env:LOCALAPPDATA = $empty
            Check 'no ollama on this PATH' (-not (Get-Command ollama -ErrorAction SilentlyContinue))
            foreach ($shell in $shells) {
              $name = Split-Path $shell -Leaf
              $out = & $shell -NoProfile -File $target -StartOnly 2>&1 | Out-String
              $code = $LASTEXITCODE
              Write-Host $out
              Check "$name -StartOnly without Ollama exits 0 (got $code)" ($code -eq 0)
              Check "$name -StartOnly says Ollama is not installed" ($out.Contains('Ollama is not installed, so there is nothing to start.'))
              $out = & $shell -NoProfile -File $target 2>&1 | Out-String
              $code = $LASTEXITCODE
              Write-Host $out
              Check "$name without Ollama exits 2 (got $code)" ($code -eq 2)
              Check "$name without Ollama names the winget command" ($out.Contains('winget install -e --id Ollama.Ollama'))
              $out = & $shell -NoProfile -File $target -Bogus 2>&1 | Out-String
              $code = $LASTEXITCODE
              Write-Host $out
              Check "$name with an unknown parameter fails (got $code)" ($code -ne 0)
              Check "$name names the unknown parameter" ($out.Contains('Bogus'))
              $out = & $shell -NoProfile -File $target 'bad model;x' 2>&1 | Out-String
              $code = $LASTEXITCODE
              Write-Host $out
              Check "$name with a bad model name exits 2 (got $code)" ($code -eq 2)
              Check "$name says it is not a model name" ($out.Contains('is not a model name'))
            }
          } finally {
            $env:Path = $savedPath; $env:LOCALAPPDATA = $savedLocal
          }
          # A server on Ollama's port that answers the chat request with something other than chat-completions JSON
          # (here the mock's event stream) must give a clear failure (exit 1), not a strict-mode error. A fake ollama.cmd
          # that does nothing stands in for Ollama, so nothing is downloaded.
          $fakeDir = Join-Path $env:RUNNER_TEMP "fake-ollama-$(Get-Random)"
          New-Item -ItemType Directory $fakeDir | Out-Null
          Set-Content -Path (Join-Path $fakeDir 'ollama.cmd') -Value "@echo off`r`nexit /b 0" -Encoding ascii
          $mockLog = Join-Path $env:RUNNER_TEMP 'mock-ollama-setup.log'
          $mock = Start-Process $shells[0] -ArgumentList '-NoProfile', '-File', 'scripts/ci/mock-ollama.ps1', '-Port', '11434', '-Seconds', '120' -PassThru -RedirectStandardOutput $mockLog
          try {
            $up = $false
            foreach ($i in 1..60) {
              try { $client = [System.Net.Sockets.TcpClient]::new('127.0.0.1', 11434); $client.Close(); $up = $true; break } catch { Start-Sleep -Milliseconds 500 }
            }
            Check 'mock listens on 127.0.0.1:11434' $up
            $env:Path = "$fakeDir;$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
            $env:LOCALAPPDATA = $empty
            $out = & $shells[0] -NoProfile -File $target -NoPin 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $out
            Check "a non-JSON chat reply exits 1 (got $code)" ($code -eq 1)
            Check 'a non-JSON chat reply is explained' ($out.Contains('was not an Ollama chat answer'))
          } finally {
            $env:Path = $savedPath; $env:LOCALAPPDATA = $savedLocal
            Stop-Process -Id $mock.Id -Force -ErrorAction SilentlyContinue
          }
          # The uninstall command the Windows page gives for the parent PIN (`cmdkey /delete:com.tristan.app/kids.pin`),
          # proven on a made-up generic credential with the same kind of target name. The real PIN entry is never touched.
          $testTarget = 'com.tristan.app/ci-cmdkey-delete-check'
          cmdkey "/generic:$testTarget" /user:tristan-ci /pass:made-up-value | Out-Host
          Check 'cmdkey lists the made-up credential' (@(cmdkey "/list:$testTarget" | Select-String 'Target:').Count -eq 1)
          cmdkey "/delete:$testTarget" | Out-Host
          Check "cmdkey /delete:$testTarget exits 0 (got $LASTEXITCODE)" ($LASTEXITCODE -eq 0)
          Check 'the made-up credential is gone' (@(cmdkey "/list:$testTarget" | Select-String 'Target:').Count -eq 0)
          if ($failures -gt 0) { exit 1 }
          exit 0

      - name: Install Swift
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE

      - name: Toolchain
        run: swift --version

      - name: Resolve packages
        run: |
          swift package resolve
          Get-Content Package.resolved

      - name: Build TristanCore
        run: swift build --target TristanCore

      - name: Build tristan
        run: swift build --product tristan

      # `swift test --filter` passes when the filter matches nothing, so the shared checker also requires a minimum
      # number of tests to have run. Its self-test first proves it rejects a log with zero (or too few) tests.
      - name: Test-count checker self-test
        run: pwsh -NoProfile -File scripts/ci/check-test-count.tests.ps1

      - name: Test TristanCore
        run: pwsh -NoProfile -File scripts/ci/check-test-count.ps1 -Filter TristanCoreTests -Minimum 200

      - name: Test TristanCLI
        run: pwsh -NoProfile -File scripts/ci/check-test-count.ps1 -Filter TristanCLITests -Minimum 100

      # Plan Tasks 13-16: the built tristan.exe against the fake provider CLIs in scripts/ci/fakes (node scripts behind
      # .cmd shims). No terminal is attached here, so `ask` must deny: for Claude Code that answer comes back through
      # this same exe started as the MCP approval shim. Nothing here uses a real account or secret.
      - name: tristan.exe against fake provider CLIs
        run: |
          $ErrorActionPreference = 'Continue'   # tristan writes status lines to stderr; exit codes are checked below
          $fakes = (Resolve-Path scripts\ci\fakes).Path
          $env:Path = "$fakes;$env:Path"
          $exe = Join-Path (swift build --show-bin-path) 'tristan.exe'
          $failures = 0
          function Check($label, $ok) {
            if ($ok) { Write-Host "PASS: $label" } else { Write-Host "FAIL: $label"; $script:failures++ }
          }
          function Run-Tristan($folder, [string[]]$arguments) {
            $output = $null | & $exe run --folder $folder @arguments 2>&1 | Out-String
            Write-Host $output
            return @{ Code = $LASTEXITCODE; Text = $output }
          }
          & $exe providers
          foreach ($case in @(
              @{ Provider = 'claude'; Mode = @(); Code = 3; File = $false; Text = 'Denied by the operator in Tristan' },
              @{ Provider = 'claude'; Mode = @('--yes-routine'); Code = 0; File = $true; Text = 'created hello.txt' },
              @{ Provider = 'copilot'; Mode = @(); Code = 3; File = $false; Text = 'Denied (no terminal to ask in)' },
              @{ Provider = 'copilot'; Mode = @('--yes-routine'); Code = 0; File = $false; Text = 'TASK<create hello.txt with hi & 100%>' })) {
            $folder = Join-Path $env:RUNNER_TEMP "fake-$($case.Provider)-$(Get-Random)"
            New-Item -ItemType Directory $folder | Out-Null
            $label = "$($case.Provider) $($case.Mode -join ' ')".Trim()
            $result = Run-Tristan $folder (@('--provider', $case.Provider) + $case.Mode + @('create hello.txt with hi & 100%'))
            Check "$label exits $($case.Code) (got $($result.Code))" ($result.Code -eq $case.Code)
            Check "$label output mentions '$($case.Text)'" ($result.Text.Contains($case.Text))
            if ($case.Provider -eq 'claude') {
              Check "$label hello.txt exists: $($case.File)" ((Test-Path (Join-Path $folder 'hello.txt')) -eq $case.File)
            }
          }
          $left = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -and $_.CommandLine.Contains('ci\fakes') -or $_.Name -eq 'tristan.exe' })
          $left | ForEach-Object { Write-Host "left running: $($_.ProcessId) $($_.Name) $($_.CommandLine)" }
          Check 'no fake CLI or tristan.exe left running' ($left.Count -eq 0)
          if ($failures -gt 0) { exit 1 }
          exit 0

      # Plan Task 12: the built tristan.exe against scripts/ci/mock-ollama.ps1 (127.0.0.1 only, two streamed chunks
      # 700 ms apart), configured only through `tristan config`.
      - name: tristan.exe against a mocked Ollama
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Continue'   # tristan writes status lines to stderr; exit codes are checked below
          $exe = Join-Path (swift build --show-bin-path) 'tristan.exe'
          $port = 11500
          $log = Join-Path $env:RUNNER_TEMP 'mock-ollama.log'
          $mock = Start-Process pwsh -ArgumentList '-NoProfile', '-File', 'scripts/ci/mock-ollama.ps1', '-Port', $port -PassThru -RedirectStandardOutput $log
          $failures = 0
          function Check($label, $ok) {
            if ($ok) { Write-Host "PASS: $label" } else { Write-Host "FAIL: $label"; $script:failures++ }
          }
          try {
            $up = $false
            foreach ($i in 1..60) {
              try { $client = [System.Net.Sockets.TcpClient]::new('127.0.0.1', $port); $client.Close(); $up = $true; break } catch { Start-Sleep -Milliseconds 500 }
            }
            Check 'mock listens on 127.0.0.1' $up
            Write-Host (Invoke-WebRequest "http://127.0.0.1:$port/api/tags" -UseBasicParsing).Content
            & $exe config set ollama.host "http://127.0.0.1:$port"
            Check 'config set ollama.host exits 0' ($LASTEXITCODE -eq 0)
            & $exe config set ollama.model mock
            Check 'config set ollama.model exits 0' ($LASTEXITCODE -eq 0)
            & $exe config set ollama.host 'http://example.com:11434'
            Check 'config set refuses a non-loopback host (exit 2)' ($LASTEXITCODE -eq 2)
            & $exe config set kidsMode false
            Check 'config set refuses kidsMode (exit 2)' ($LASTEXITCODE -eq 2)
            & $exe config list
            & $exe secret status
            Check 'secret status exits 0' ($LASTEXITCODE -eq 0)
            $null | & $exe secret set azure-openai-key 2>&1 | Out-Host
            Check 'secret set without a terminal exits 2' ($LASTEXITCODE -eq 2)
            $providers = & $exe providers 2>&1 | Out-String
            Write-Host $providers
            Check 'providers: ollama ready' ($providers -match '(?m)^ollama\s+ready')
            $folder = Join-Path $env:RUNNER_TEMP "mock-ollama-$(Get-Random)"
            New-Item -ItemType Directory $folder | Out-Null
            $started = Get-Date
            $output = $null | & $exe run --provider ollama --folder $folder hello 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $output
            Check "run --provider ollama exits 0 (got $code)" ($code -eq 0)
            Check 'output has the streamed answer' ($output.Contains('Hello from the mock Ollama.'))
            Check 'the run waited for the second chunk' (((Get-Date) - $started).TotalMilliseconds -ge 700)
          } finally {
            Stop-Process -Id $mock.Id -Force -ErrorAction SilentlyContinue
            Write-Host '== mock log'
            Get-Content $log -ErrorAction SilentlyContinue
          }
          Check 'mock saw GET /api/tags and POST /v1/chat/completions' ((Get-Content $log -Raw).Contains('GET /api/tags') -and (Get-Content $log -Raw).Contains('POST /v1/chat/completions'))
          & $exe config unset ollama.host
          & $exe config unset ollama.model
          if ($failures -gt 0) { exit 1 }
          exit 0

      # Plan Task 12 + ruling R11: the zip the release attaches, built the way release.yml builds it.
      - name: Package tristan.exe (0.0.0-ci)
        run: pwsh -NoProfile -File scripts/package-windows.ps1 -Version 0.0.0-ci

      - name: Upload the zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tristan-windows
          path: |
            dist/Tristan-0.0.0-ci-windows-x64.zip
            dist/Tristan-0.0.0-ci-windows-x64.zip.sha256
          if-no-files-found: error

      # The extracted zip on a PATH without the Swift toolchain: it must run on a Windows machine that has no Swift.
      - name: Verify the zip on a clean PATH
        run: |
          $ErrorActionPreference = 'Continue'
          $failures = 0
          function Check($label, $ok) {
            if ($ok) { Write-Host "PASS: $label" } else { Write-Host "FAIL: $label"; $script:failures++ }
          }
          $zip = (Resolve-Path dist\Tristan-0.0.0-ci-windows-x64.zip).Path
          $expected = ((Get-Content "$zip.sha256" -Raw) -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Check "sha256 matches ($actual)" ($expected -eq $actual)
          Check 'sha256 file names the zip' ((Get-Content "$zip.sha256" -Raw).Contains('  Tristan-0.0.0-ci-windows-x64.zip'))
          $clean = Join-Path $env:RUNNER_TEMP "clean-$(Get-Random)"
          Expand-Archive $zip -DestinationPath $clean
          Get-ChildItem $clean | ForEach-Object { Write-Host ("  {0,12:N0}  {1}" -f $_.Length, $_.Name) }
          foreach ($file in 'tristan.exe', 'LICENSE.txt', 'README.txt', 'THIRD-PARTY-NOTICES.txt') { Check "zip has $file" (Test-Path (Join-Path $clean $file)) }
          $notices = Get-Content (Join-Path $clean 'THIRD-PARTY-NOTICES.txt') -Raw
          Check "THIRD-PARTY-NOTICES.txt is not empty ($($notices.Length) characters)" ($notices.Length -gt 1000)
          foreach ($text in 'Runtime Library Exception', 'UNICODE LICENSE V3', 'Daniel Stenberg', 'Jean-loup Gailly', 'Brotli', 'BoringSSL') {
            Check "THIRD-PARTY-NOTICES.txt mentions '$text'" ($notices.Contains($text))
          }
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          Write-Host "PATH=$env:Path"
          Check 'swift is not on PATH' (-not (Get-Command swift -ErrorAction SilentlyContinue))
          $exe = Join-Path $clean 'tristan.exe'
          $version = (& $exe --version 2>&1 | Out-String).Trim()
          Check "tristan --version prints 0.0.0-ci (got '$version', exit $LASTEXITCODE)" ($version -eq '0.0.0-ci' -and $LASTEXITCODE -eq 0)
          $started = Get-Date
          & $exe providers
          $code = $LASTEXITCODE
          $seconds = ((Get-Date) - $started).TotalSeconds
          Check "providers exits 0 (got $code)" ($code -eq 0)
          Check "providers answers within 15 s with no Ollama running (took $([int]$seconds) s)" ($seconds -lt 15)
          if ($failures -gt 0) { exit 1 }
          exit 0

      # The installer (Inno Setup 6.7.3, pinned in the script) from the staging folder the zip was made from, then
      # silent per-user install, upgrade and uninstall, a run without the PATH task and an all-users run, checking
      # files, `tristan --version`, PATH (value and type) and that user data survives. release.yml runs the same two
      # scripts with the version from the tag.
      - name: Build the installer (0.0.0-ci)
        run: pwsh -NoProfile -File scripts/package-windows-installer.ps1 -Version 0.0.0-ci

      - name: Test the installer (install, upgrade, uninstall, PATH, all users)
        run: pwsh -NoProfile -File scripts/ci/test-installer.ps1 -Installer dist/Tristan-0.0.0-ci-windows-x64-setup.exe -Version 0.0.0-ci -StageDir dist/Tristan-0.0.0-ci-windows-x64 -LogDir "$env:RUNNER_TEMP/installer-logs-0.0.0-ci"

      # The same artifact as above, now with the installer too (the zip is uploaded first so it is there even if the
      # installer fails).
      - name: Upload the zip and the installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tristan-windows
          overwrite: true
          path: |
            dist/Tristan-0.0.0-ci-windows-x64.zip
            dist/Tristan-0.0.0-ci-windows-x64.zip.sha256
            dist/Tristan-0.0.0-ci-windows-x64-setup.exe
            dist/Tristan-0.0.0-ci-windows-x64-setup.exe.sha256
          if-no-files-found: error

      # release.yml's Windows job turns the tag into a version with exactly these lines (there $ref is
      # $env:GITHUB_REF_NAME); made-up tags prove the derivation, the stamping, the zip name and the checks.
      - name: Package as a release would (tags v9.9.9-test, v1.2, v1.2.3_rc1, v1.2.3-<Kelvin sign>)
        run: |
          # The script itself refuses a version with a non-ASCII letter (case-sensitive check), before building.
          pwsh -NoProfile -File scripts/package-windows.ps1 -Version "1.2.$([char]0x212A)"
          if ($LASTEXITCODE -eq 0) { throw "package-windows.ps1 accepted a version with the Kelvin sign U+212A" }
          Write-Host "PASS: package-windows.ps1 refuses a version with U+212A"
          foreach ($case in @(@{ Tag = 'v9.9.9-test'; Want = '9.9.9-test' }, @{ Tag = 'v1.2'; Want = '1.2' },
                              @{ Tag = 'v1.2.3_rc1'; Want = '1.2.3-rc1' },
                              @{ Tag = "v1.2.3-$([char]0x212A)"; Want = '1.2.3--' })) {
            $ref = $case.Tag
            $version = ($ref -creplace '^v', '') -creplace '[^0-9A-Za-z.-]', '-'
            if (-not $version) { $version = '0.0.0' }
            pwsh -NoProfile -File scripts/package-windows.ps1 -Version $version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # The extracted exe reports the version, the checksum matches and the third-party notices are there.
            $zip = "dist/Tristan-$version-windows-x64.zip"
            $clean = Join-Path $env:RUNNER_TEMP "release-check-$version"
            Expand-Archive $zip -DestinationPath $clean
            $printed = (& (Join-Path $clean 'tristan.exe') --version | Out-String).Trim()
            if ($printed -ne $version) { throw "tristan --version printed '$printed', expected '$version'" }
            $expected = ((Get-Content "$zip.sha256" -Raw) -split '\s+')[0]
            if ((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant() -ne $expected) { throw "The sha256 of $zip does not match" }
            $notices = Join-Path $clean 'THIRD-PARTY-NOTICES.txt'
            if (-not (Test-Path $notices) -or (Get-Item $notices).Length -lt 1000) { throw "$zip has no THIRD-PARTY-NOTICES.txt" }
            if ($version -ne $case.Want) { throw "$ref gave version '$version', expected '$($case.Want)'" }
            if (-not (Test-Path "dist/Tristan-$($case.Want)-windows-x64.zip")) { throw "No dist/Tristan-$($case.Want)-windows-x64.zip" }
            Write-Host "PASS: $ref -> $version, $zip, tristan --version $printed, sha256 $expected"
          }

      # release.yml's installer step with a made-up tag: the same lines, with $ref set here instead of from GITHUB_REF_NAME.
      # The zip and staging folder for 1.2.3-rc1 were made by the step above.
      - name: Installer as a release would (tag v1.2.3_rc1)
        run: |
          $ref = 'v1.2.3_rc1'
          $version = ($ref -creplace '^v', '') -creplace '[^0-9A-Za-z.-]', '-'
          if (-not $version) { $version = '0.0.0' }
          pwsh -NoProfile -File scripts/package-windows-installer.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/ci/test-installer.ps1 -Installer "dist/Tristan-$version-windows-x64-setup.exe" -Version $version -StageDir "dist/Tristan-$version-windows-x64" -LogDir "$env:RUNNER_TEMP/installer-logs-$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/Tristan-1.2.3-rc1-windows-x64-setup.exe.sha256')) { throw 'No dist/Tristan-1.2.3-rc1-windows-x64-setup.exe.sha256' }
          Write-Host "PASS: $ref -> $version, dist/Tristan-$version-windows-x64-setup.exe built and tested"

      # The /LOG files of every installer and uninstaller run above, when any step failed.
      - name: Upload the installer logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-logs
          path: ${{ runner.temp }}/installer-logs-*
          if-no-files-found: ignore

  # Plan Task 0 (spike): facts about this runner that later tasks rely on. Diagnostic only, so every check may fail
  # without failing the run; read the log. Notes: docs/superpowers/specs/2026-11-06-windows-spike-notes.md
  windows-spike:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Swift
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE

      - name: (a) Swift version
        continue-on-error: true
        run: swift --version

      - name: (d) Tools on PATH
        continue-on-error: true
        run: |
          foreach ($name in 'pwsh', 'powershell', 'node', 'git', 'npm', 'aws', 'az', 'claude', 'copilot') {
            Write-Host "== where.exe $name"
            where.exe $name 2>&1 | ForEach-Object { Write-Host "   $_" }
          }
          Write-Host "PATHEXT=$env:PATHEXT"
          Write-Host "USERDOMAIN=$env:USERDOMAIN USERNAME=$env:USERNAME"
          whoami /user

      - name: Build the spike tools
        continue-on-error: true
        run: |
          swift build --package-path scripts/ci/spike
          $bin = swift build --package-path scripts/ci/spike --show-bin-path
          Copy-Item "$bin\argdump.exe" scripts\ci\spike\fixtures\
          "SPIKE_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: (b) Does URLSession stream chunks as they arrive?
        continue-on-error: true
        run: |
          $server = Start-Process pwsh -ArgumentList '-NoProfile', '-File', 'scripts/ci/spike/stream-server.ps1' -PassThru
          Start-Sleep -Seconds 3
          & "$env:SPIKE_BIN\stream-client.exe" http://localhost:18080/
          $status = $LASTEXITCODE
          Stop-Process -Id $server.Id -Force
          exit $status

      - name: (c) Process with awkward arguments
        continue-on-error: true
        run: |
          $launch = "$env:SPIKE_BIN\launch.exe"
          $fixtures = (Resolve-Path scripts\ci\spike\fixtures).Path
          Write-Host "== a real .exe"
          & $launch --tricky "$fixtures\argdump.exe"
          Write-Host "== a .cmd file (cmd.exe in the middle)"
          & $launch --tricky "$fixtures\hello.cmd"
          Write-Host "== an npm-style shim"
          & $launch --tricky "$fixtures\shim.cmd"
          Write-Host "== the node script behind it, started directly"
          & $launch --tricky (Get-Command node).Source "$fixtures\node_modules\dump\cli.js"
          Write-Host "== pwsh -File"
          & $launch --tricky (Get-Command pwsh).Source -NoProfile -File "$fixtures\dump.ps1"
          Write-Host "== powershell.exe -File"
          & $launch --tricky (Get-Command powershell).Source -NoProfile -File "$fixtures\dump.ps1"
          Write-Host "== run_command style: pwsh -Command <text> (non-ASCII output, exit status)"
          & $launch (Get-Command pwsh).Source -NoLogo -NoProfile -NonInteractive -Command "Write-Output 'a & b' '100%' 'caf$([char]0xE9) $([char]0x65E5)$([char]0x672C)'; exit 3"
          Write-Host "== same with powershell.exe"
          & $launch (Get-Command powershell).Source -NoLogo -NoProfile -NonInteractive -Command "Write-Output 'a & b' '100%' 'caf$([char]0xE9) $([char]0x65E5)$([char]0x672C)'; exit 3"
          Write-Host "== a bare name (Foundation.Process does not search PATH)"
          & $launch az --version
          & $launch aws --version
          Write-Host "== resolved full paths"
          foreach ($tool in 'az', 'aws') {
            $found = (Get-Command $tool -ErrorAction SilentlyContinue).Source
            if ($found) { & $launch $found --version } else { Write-Host "$tool not installed" }
          }

      - name: (e) icacls with USERDOMAIN\USERNAME, taskkill /T /F
        continue-on-error: true
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "spike-acl-$(Get-Random)"
          New-Item -ItemType Directory $dir | Out-Null
          icacls $dir /inheritance:r /grant:r "${env:USERDOMAIN}\${env:USERNAME}:(OI)(CI)F"
          Write-Host "icacls exit $LASTEXITCODE"
          icacls $dir
          Remove-Item $dir -Recurse -Force
          Write-Host "== taskkill /T /F on a cmd -> ping tree"
          $root = Start-Process cmd -ArgumentList '/c', 'ping -n 60 127.0.0.1 > nul' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $children = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($root.Id)"
          Write-Host "root $($root.Id) children: $($children.ProcessId -join ', ')"
          taskkill /T /F /PID $root.Id
          Start-Sleep -Seconds 1
          foreach ($id in @($root.Id) + @($children.ProcessId)) {
            if (Get-Process -Id $id -ErrorAction SilentlyContinue) { Write-Host "STILL RUNNING: $id" } else { Write-Host "gone: $id" }
          }

      - name: (f) Third-party code in the shipped Swift DLLs, and the toolchain's licence files
        continue-on-error: true
        run: |
          $swift = Join-Path $env:LOCALAPPDATA 'Programs\Swift'
          Write-Host "== licence-like files under $swift"
          $files = Get-ChildItem $swift -Recurse -File | Where-Object { $_.Name -match '(?i)licen[cs]e|notice|copying|copyright|third.?party|acknowledg' }
          $files | ForEach-Object { Write-Host ("{0,10}  {1}" -f $_.Length, $_.FullName) }
          foreach ($file in $files | Where-Object { $_.Length -lt 200000 -and $_.Extension -notin '.dll', '.exe', '.lib', '.swiftmodule' }) {
            Write-Host "===== BEGIN $($file.FullName)"
            Get-Content $file.FullName | ForEach-Object { Write-Host "| $_" }
            Write-Host "===== END $($file.FullName)"
          }
          Get-ChildItem $swift -Directory | ForEach-Object { Write-Host "   $($_.FullName)" }
          Get-ChildItem $swift -Recurse -Directory -Depth 2 | ForEach-Object { Write-Host "   $($_.FullName)" }
          # Printable strings that name a component, a version or a copyright.
          $keywords = '(?i)curl|zlib|inflate|deflate|nghttp|brotli|zstd|openssl|boringssl|schannel|libssh|idn|psl|gzip|copyright|licen[cs]e|unicode, inc|icu [0-9]|icudt|mozilla|expat|libxml'
          $runtime = Get-ChildItem $swift -Recurse -Filter FoundationNetworking.dll | Where-Object { $_.FullName -match '\\usr\\bin\\' } | Select-Object -First 1
          $bin = $runtime.DirectoryName
          Write-Host "== runtime folder: $bin"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          foreach ($name in 'FoundationNetworking.dll', '_FoundationICU.dll', 'Foundation.dll', 'FoundationEssentials.dll', 'FoundationInternationalization.dll', 'swiftCore.dll', 'dispatch.dll') {
            $path = Join-Path $bin $name
            if (-not (Test-Path $path)) { Write-Host "== $name not found"; continue }
            $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($path))
            Write-Host "== $name ($((Get-Item $path).Length) bytes)"
            $strings = [regex]::Matches($text, '[\x20-\x7E]{5,}') | ForEach-Object { $_.Value } | Where-Object { $_ -match $keywords } | Sort-Object -Unique
            Write-Host "   $(@($strings).Count) matching strings"
            $strings | Select-Object -First 150 | ForEach-Object { Write-Host "   | $($_.Substring(0, [Math]::Min(200, $_.Length)))" }
            & $dumpbin /nologo /dependents $path | Where-Object { $_ -match '\.dll' } | ForEach-Object { Write-Host "   dep $($_.Trim())" }
          }
