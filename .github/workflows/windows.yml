name: Windows

on:
  push:
    branches: [windows-cli, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The portable core and the `tristan` command on a real Windows machine. The Mac app (AppKit) is not built here:
  # Package.swift only declares it on macOS.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Swift
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE

      - name: Toolchain
        run: swift --version

      - name: Resolve packages
        run: |
          swift package resolve
          Get-Content Package.resolved

      - name: Build TristanCore
        run: swift build --target TristanCore

      - name: Build tristan
        run: swift build --product tristan

      - name: Test TristanCore
        run: swift test --filter TristanCoreTests

      - name: Test TristanCLI
        run: swift test --filter TristanCLITests

      # Plan Tasks 13-16: the built tristan.exe against the fake provider CLIs in scripts/ci/fakes (node scripts behind
      # .cmd shims). No terminal is attached here, so `ask` must deny: for Claude Code that answer comes back through
      # this same exe started as the MCP approval shim. Nothing here uses a real account or secret.
      - name: tristan.exe against fake provider CLIs
        run: |
          $ErrorActionPreference = 'Continue'   # tristan writes status lines to stderr; exit codes are checked below
          $fakes = (Resolve-Path scripts\ci\fakes).Path
          $env:Path = "$fakes;$env:Path"
          $exe = Join-Path (swift build --show-bin-path) 'tristan.exe'
          $failures = 0
          function Check($label, $ok) {
            if ($ok) { Write-Host "PASS: $label" } else { Write-Host "FAIL: $label"; $script:failures++ }
          }
          function Run-Tristan($folder, [string[]]$arguments) {
            $output = $null | & $exe run --folder $folder @arguments 2>&1 | Out-String
            Write-Host $output
            return @{ Code = $LASTEXITCODE; Text = $output }
          }
          & $exe providers
          foreach ($case in @(
              @{ Provider = 'claude'; Mode = @(); Code = 3; File = $false; Text = 'Denied by the operator in Tristan' },
              @{ Provider = 'claude'; Mode = @('--yes-routine'); Code = 0; File = $true; Text = 'created hello.txt' },
              @{ Provider = 'copilot'; Mode = @(); Code = 3; File = $false; Text = 'Denied (no terminal to ask in)' },
              @{ Provider = 'copilot'; Mode = @('--yes-routine'); Code = 0; File = $false; Text = 'TASK<create hello.txt with hi & 100%>' })) {
            $folder = Join-Path $env:RUNNER_TEMP "fake-$($case.Provider)-$(Get-Random)"
            New-Item -ItemType Directory $folder | Out-Null
            $label = "$($case.Provider) $($case.Mode -join ' ')".Trim()
            $result = Run-Tristan $folder (@('--provider', $case.Provider) + $case.Mode + @('create hello.txt with hi & 100%'))
            Check "$label exits $($case.Code) (got $($result.Code))" ($result.Code -eq $case.Code)
            Check "$label output mentions '$($case.Text)'" ($result.Text.Contains($case.Text))
            if ($case.Provider -eq 'claude') {
              Check "$label hello.txt exists: $($case.File)" ((Test-Path (Join-Path $folder 'hello.txt')) -eq $case.File)
            }
          }
          $left = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -and $_.CommandLine.Contains('ci\fakes') -or $_.Name -eq 'tristan.exe' })
          $left | ForEach-Object { Write-Host "left running: $($_.ProcessId) $($_.Name) $($_.CommandLine)" }
          Check 'no fake CLI or tristan.exe left running' ($left.Count -eq 0)
          if ($failures -gt 0) { exit 1 }
          exit 0

      # Plan Task 12: the built tristan.exe against scripts/ci/mock-ollama.ps1 (127.0.0.1 only, two streamed chunks
      # 700 ms apart), configured only through `tristan config`.
      - name: tristan.exe against a mocked Ollama
        run: |
          $ErrorActionPreference = 'Continue'   # tristan writes status lines to stderr; exit codes are checked below
          $exe = Join-Path (swift build --show-bin-path) 'tristan.exe'
          $port = 11500
          $log = Join-Path $env:RUNNER_TEMP 'mock-ollama.log'
          $mock = Start-Process pwsh -ArgumentList '-NoProfile', '-File', 'scripts/ci/mock-ollama.ps1', '-Port', $port -PassThru -RedirectStandardOutput $log
          $failures = 0
          function Check($label, $ok) {
            if ($ok) { Write-Host "PASS: $label" } else { Write-Host "FAIL: $label"; $script:failures++ }
          }
          try {
            $up = $false
            foreach ($i in 1..60) {
              try { $client = [System.Net.Sockets.TcpClient]::new('127.0.0.1', $port); $client.Close(); $up = $true; break } catch { Start-Sleep -Milliseconds 500 }
            }
            Check 'mock listens on 127.0.0.1' $up
            Write-Host (Invoke-WebRequest "http://127.0.0.1:$port/api/tags" -UseBasicParsing).Content
            & $exe config set ollama.host "http://127.0.0.1:$port"
            Check 'config set ollama.host exits 0' ($LASTEXITCODE -eq 0)
            & $exe config set ollama.model mock
            Check 'config set ollama.model exits 0' ($LASTEXITCODE -eq 0)
            & $exe config set ollama.host 'http://example.com:11434'
            Check 'config set refuses a non-loopback host (exit 2)' ($LASTEXITCODE -eq 2)
            & $exe config set kidsMode false
            Check 'config set refuses kidsMode (exit 2)' ($LASTEXITCODE -eq 2)
            & $exe config list
            & $exe secret status
            Check 'secret status exits 0' ($LASTEXITCODE -eq 0)
            $null | & $exe secret set azure-openai-key 2>&1 | Out-Host
            Check 'secret set without a terminal exits 2' ($LASTEXITCODE -eq 2)
            $providers = & $exe providers 2>&1 | Out-String
            Write-Host $providers
            Check 'providers: ollama ready' ($providers -match '(?m)^ollama\s+ready')
            $folder = Join-Path $env:RUNNER_TEMP "mock-ollama-$(Get-Random)"
            New-Item -ItemType Directory $folder | Out-Null
            $started = Get-Date
            $output = $null | & $exe run --provider ollama --folder $folder hello 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $output
            Check "run --provider ollama exits 0 (got $code)" ($code -eq 0)
            Check 'output has the streamed answer' ($output.Contains('Hello from the mock Ollama.'))
            Check 'the run waited for the second chunk' (((Get-Date) - $started).TotalMilliseconds -ge 700)
          } finally {
            Stop-Process -Id $mock.Id -Force -ErrorAction SilentlyContinue
            Write-Host '== mock log'
            Get-Content $log -ErrorAction SilentlyContinue
          }
          Check 'mock saw GET /api/tags and POST /v1/chat/completions' ((Get-Content $log -Raw).Contains('GET /api/tags') -and (Get-Content $log -Raw).Contains('POST /v1/chat/completions'))
          & $exe config unset ollama.host
          & $exe config unset ollama.model
          if ($failures -gt 0) { exit 1 }
          exit 0

      # Plan Task 12 + ruling R11: the zip the release attaches, built the way release.yml builds it.
      - name: Package tristan.exe (0.0.0-ci)
        run: pwsh -NoProfile -File scripts/package-windows.ps1 -Version 0.0.0-ci

      - name: Upload the zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tristan-windows
          path: |
            dist/Tristan-0.0.0-ci-windows-x64.zip
            dist/Tristan-0.0.0-ci-windows-x64.zip.sha256
          if-no-files-found: error

      # The extracted zip on a PATH without the Swift toolchain: it must run on a Windows machine that has no Swift.
      - name: Verify the zip on a clean PATH
        run: |
          $ErrorActionPreference = 'Continue'
          $failures = 0
          function Check($label, $ok) {
            if ($ok) { Write-Host "PASS: $label" } else { Write-Host "FAIL: $label"; $script:failures++ }
          }
          $zip = (Resolve-Path dist\Tristan-0.0.0-ci-windows-x64.zip).Path
          $expected = ((Get-Content "$zip.sha256" -Raw) -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Check "sha256 matches ($actual)" ($expected -eq $actual)
          Check 'sha256 file names the zip' ((Get-Content "$zip.sha256" -Raw).Contains('  Tristan-0.0.0-ci-windows-x64.zip'))
          $clean = Join-Path $env:RUNNER_TEMP "clean-$(Get-Random)"
          Expand-Archive $zip -DestinationPath $clean
          Get-ChildItem $clean | ForEach-Object { Write-Host ("  {0,12:N0}  {1}" -f $_.Length, $_.Name) }
          foreach ($file in 'tristan.exe', 'LICENSE.txt', 'README.txt') { Check "zip has $file" (Test-Path (Join-Path $clean $file)) }
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          Write-Host "PATH=$env:Path"
          Check 'swift is not on PATH' (-not (Get-Command swift -ErrorAction SilentlyContinue))
          $exe = Join-Path $clean 'tristan.exe'
          $version = (& $exe --version 2>&1 | Out-String).Trim()
          Check "tristan --version prints 0.0.0-ci (got '$version', exit $LASTEXITCODE)" ($version -eq '0.0.0-ci' -and $LASTEXITCODE -eq 0)
          & $exe providers
          Check "providers exits 0 (got $LASTEXITCODE)" ($LASTEXITCODE -eq 0)
          if ($failures -gt 0) { exit 1 }
          exit 0

      # release.yml's Windows job derives the version from the tag with exactly these lines (there the tag is
      # $env:GITHUB_REF_NAME); a made-up tag proves the derivation, the stamping and the zip name.
      - name: Package as a release would (tag v9.9.9-test)
        run: |
          $tag = 'v9.9.9-test'
          if ($tag -notmatch '\Av[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\z') { throw "The tag '$tag' is not like v1.2.3" }
          $version = $tag.Substring(1)
          pwsh -NoProfile -File scripts/package-windows.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $clean = Join-Path $env:RUNNER_TEMP "release-$(Get-Random)"
          Expand-Archive dist\Tristan-9.9.9-test-windows-x64.zip -DestinationPath $clean
          $printed = (& (Join-Path $clean 'tristan.exe') --version | Out-String).Trim()
          Write-Host "tristan --version: $printed"
          if ($printed -ne '9.9.9-test') { throw "expected 9.9.9-test, got '$printed'" }
          Get-Content dist\Tristan-9.9.9-test-windows-x64.zip.sha256

  # Plan Task 0 (spike): facts about this runner that later tasks rely on. Diagnostic only, so every check may fail
  # without failing the run; read the log. Notes: docs/superpowers/specs/2026-11-06-windows-spike-notes.md
  windows-spike:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Swift
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE

      - name: (a) Swift version
        continue-on-error: true
        run: swift --version

      - name: (d) Tools on PATH
        continue-on-error: true
        run: |
          foreach ($name in 'pwsh', 'powershell', 'node', 'git', 'npm', 'aws', 'az', 'claude', 'copilot') {
            Write-Host "== where.exe $name"
            where.exe $name 2>&1 | ForEach-Object { Write-Host "   $_" }
          }
          Write-Host "PATHEXT=$env:PATHEXT"
          Write-Host "USERDOMAIN=$env:USERDOMAIN USERNAME=$env:USERNAME"
          whoami /user

      - name: Build the spike tools
        continue-on-error: true
        run: |
          swift build --package-path scripts/ci/spike
          $bin = swift build --package-path scripts/ci/spike --show-bin-path
          Copy-Item "$bin\argdump.exe" scripts\ci\spike\fixtures\
          "SPIKE_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: (b) Does URLSession stream chunks as they arrive?
        continue-on-error: true
        run: |
          $server = Start-Process pwsh -ArgumentList '-NoProfile', '-File', 'scripts/ci/spike/stream-server.ps1' -PassThru
          Start-Sleep -Seconds 3
          & "$env:SPIKE_BIN\stream-client.exe" http://localhost:18080/
          $status = $LASTEXITCODE
          Stop-Process -Id $server.Id -Force
          exit $status

      - name: (c) Process with awkward arguments
        continue-on-error: true
        run: |
          $launch = "$env:SPIKE_BIN\launch.exe"
          $fixtures = (Resolve-Path scripts\ci\spike\fixtures).Path
          Write-Host "== a real .exe"
          & $launch --tricky "$fixtures\argdump.exe"
          Write-Host "== a .cmd file (cmd.exe in the middle)"
          & $launch --tricky "$fixtures\hello.cmd"
          Write-Host "== an npm-style shim"
          & $launch --tricky "$fixtures\shim.cmd"
          Write-Host "== the node script behind it, started directly"
          & $launch --tricky (Get-Command node).Source "$fixtures\node_modules\dump\cli.js"
          Write-Host "== pwsh -File"
          & $launch --tricky (Get-Command pwsh).Source -NoProfile -File "$fixtures\dump.ps1"
          Write-Host "== powershell.exe -File"
          & $launch --tricky (Get-Command powershell).Source -NoProfile -File "$fixtures\dump.ps1"
          Write-Host "== run_command style: pwsh -Command <text> (non-ASCII output, exit status)"
          & $launch (Get-Command pwsh).Source -NoLogo -NoProfile -NonInteractive -Command "Write-Output 'a & b' '100%' 'caf$([char]0xE9) $([char]0x65E5)$([char]0x672C)'; exit 3"
          Write-Host "== same with powershell.exe"
          & $launch (Get-Command powershell).Source -NoLogo -NoProfile -NonInteractive -Command "Write-Output 'a & b' '100%' 'caf$([char]0xE9) $([char]0x65E5)$([char]0x672C)'; exit 3"
          Write-Host "== a bare name (Foundation.Process does not search PATH)"
          & $launch az --version
          & $launch aws --version
          Write-Host "== resolved full paths"
          foreach ($tool in 'az', 'aws') {
            $found = (Get-Command $tool -ErrorAction SilentlyContinue).Source
            if ($found) { & $launch $found --version } else { Write-Host "$tool not installed" }
          }

      - name: (e) icacls with USERDOMAIN\USERNAME, taskkill /T /F
        continue-on-error: true
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "spike-acl-$(Get-Random)"
          New-Item -ItemType Directory $dir | Out-Null
          icacls $dir /inheritance:r /grant:r "${env:USERDOMAIN}\${env:USERNAME}:(OI)(CI)F"
          Write-Host "icacls exit $LASTEXITCODE"
          icacls $dir
          Remove-Item $dir -Recurse -Force
          Write-Host "== taskkill /T /F on a cmd -> ping tree"
          $root = Start-Process cmd -ArgumentList '/c', 'ping -n 60 127.0.0.1 > nul' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $children = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($root.Id)"
          Write-Host "root $($root.Id) children: $($children.ProcessId -join ', ')"
          taskkill /T /F /PID $root.Id
          Start-Sleep -Seconds 1
          foreach ($id in @($root.Id) + @($children.ProcessId)) {
            if (Get-Process -Id $id -ErrorAction SilentlyContinue) { Write-Host "STILL RUNNING: $id" } else { Write-Host "gone: $id" }
          }
