name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build the installable app and DMG
        run: VERSION=0.0.0-ci scripts/make-dmg.sh

      - name: Check the app bundle
        run: |
          test -x Tristan.app/Contents/MacOS/Tristan
          codesign --verify --deep --strict Tristan.app

      - name: Upload DMG (every build is installable for testing)
        uses: actions/upload-artifact@v4
        with:
          name: Tristan-dmg
          path: dist/*.dmg*

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: What iOS tooling does this runner have?
        run: |
          xcodebuild -showsdks | grep -i "ios" || true
          xcrun simctl list runtimes || true

      - name: Build the iOS app (needs no simulator runtime)
        run: |
          xcodebuild build -project ios/TristanIOS.xcodeproj -scheme TristanIOS \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build -quiet

      - name: Run the iOS tests (only when an iPhone simulator runtime is installed)
        run: |
          DEST_ID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' || true)
          if [ -z "$DEST_ID" ] || ! xcodebuild test -project ios/TristanIOS.xcodeproj -scheme TristanIOS \
               -destination "id=$DEST_ID" -derivedDataPath ios/build -quiet; then
            echo "::warning::iOS tests did not run on this runner (no usable simulator runtime). They pass locally."
          fi
